[project]
name = "jira-policy-mcp"
version = "0.1.0"
description = "A policy-enforcing MCP server that gives an AI agent scoped, least-privilege access to Jira."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gerald Voit" }]
keywords = ["mcp", "jira", "policy", "least-privilege", "claude"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jira-policy-mcp = "jira_policy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_policy_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
